<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教室｜Melody Town</title>
  <link rel="stylesheet" href="/static/web/page_transition.css">
  <link rel="stylesheet" href="/static/web/student_class.css">
</head>
<body>
  <main class="stage page-transition" aria-label="學生教室">
    <img
      class="stage__bg"
      src="/assets/material/class.png"
      alt="Melody Town 教室"
      draggable="false"
    >

    <!-- 佈告欄：兩廳院近一個月音樂節目（自動橫向切換） -->
    <section class="board-panel" aria-label="兩廳院音樂節目看板">
      <h1 class="board-panel__title">兩廳院音樂節目</h1>

      <div class="board-carousel" data-carousel>
        <div class="board-track" data-carousel-track tabindex="0" aria-live="polite"></div>
      </div>

      <div class="board-dots" data-carousel-dots aria-hidden="true"></div>
    </section>

    <a
      class="map-btn"
      href="/student/home"
      title="返回主頁"
      aria-label="MAP，返回主頁"
    ></a>
  </main>

  <script src="/static/web/page_transition.js"></script>
  <script src="/static/web/student_class.js"></script>
</body>
</html>
