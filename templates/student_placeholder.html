<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}｜Melody Town</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1410;
      color: #fff8e7;
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .card {
      width: min(92vw, 420px);
      padding: 28px 24px;
      border: 1px solid rgba(255, 215, 120, 0.35);
      border-radius: 16px;
      background: rgba(40, 28, 18, 0.92);
      text-align: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
    }
    p {
      margin: 0 0 20px;
      line-height: 1.6;
      color: #f0e2c8;
    }
    a {
      color: #ffd978;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a href="/student/home">← 返回主頁地圖</a>
  </div>
</body>
</html>
